name: Build and upload portable packages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-portable.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Fix Windows startup and publish'))
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: paper-desk-portable-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build both archives and verify Windows
        run: python packaging/build_portable.py --source . --output dist --test-windows
      - name: Create the release and attach both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Encoding utf8 version.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "packaging/RELEASE-$tag.md"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "阅研 · Paper Desk $tag" --notes-file $notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (-not ($existing | ConvertFrom-Json).isDraft) {
            throw 'Refusing to replace an already published release.'
          }
          $assets = @(
            "dist/PaperDesk-Windows-x64-$tag.zip",
            "dist/PaperDesk-macOS-arm64-$tag.zip",
            "dist/SHA256SUMS.txt"
          )
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tag -eq 'v1.1.2') {
            gh release edit v1.1.1 --repo $env:GITHUB_REPOSITORY --prerelease --latest=false --notes "此构建预览已由 v1.1.2 取代。请从 v1.1.2 下载 Windows 和 macOS 安装包。"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
